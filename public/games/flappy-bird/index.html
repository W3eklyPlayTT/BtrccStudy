<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flappy Bird | BtrccGames</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="/">← BtrccGames</a>
      <h1>Flappy Bird</h1>
      <p class="subtitle">Press <kbd>Space</kbd> or click the game to flap.</p>
      <section class="game-shell" aria-label="Flappy Bird game">
        <div class="game-container" tabindex="0" role="application" aria-label="Flappy Bird. Press space or click to flap.">
          <div class="sky"><div class="bird"></div></div>
          <div class="ground-moving"></div>
        </div>
      </section>
      <p class="footer-hint">Click or tap inside the game · Spacebar to flap</p>
    </main>
  </body>
</html>
