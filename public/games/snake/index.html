<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>Snake · BtrccGames</title>
  <link rel="stylesheet" href="snake-google.css">
</head>
<body>
  <main class="snake-app">
    <header class="topbar">
      <a class="back-link" href="/" aria-label="Back to BtrccGames">← <span>BtrccGames</span></a>
      <h1>Snake</h1>
      <button id="pause-button" class="icon-button" type="button" aria-label="Pause game" title="Pause · Space">Ⅱ</button>
    </header>

    <section class="game-panel" aria-label="Snake game">
      <div class="scorebar">
        <div><span class="score-label">SCORE</span><strong id="score">0</strong></div>
        <div class="best-score"><span class="score-label">BEST</span><strong id="best-score">0</strong></div>
      </div>

      <div class="board-wrap">
        <canvas id="game-board" width="600" height="600" aria-label="Snake game board"></canvas>
        <div id="game-overlay" class="game-overlay">
          <div class="overlay-card">
            <span class="overlay-apple" aria-hidden="true">●</span>
            <h2 id="overlay-title">Ready to play?</h2>
            <p id="overlay-message">Eat the apples, grow your snake, and avoid the walls and your tail.</p>
            <button id="start-button" class="start-button" type="button">Play</button>
          </div>
        </div>
      </div>

      <div class="game-toolbar">
        <label for="speed">Speed
          <select id="speed">
            <option value="150">Slow</option>
            <option value="115" selected>Classic</option>
            <option value="85">Fast</option>
          </select>
        </label>
        <button id="restart-button" class="tool-button" type="button">↻ <span>New game</span></button>
      </div>

      <div class="mobile-pad" aria-label="Touch controls">
        <button type="button" data-direction="up" aria-label="Up">↑</button>
        <div><button type="button" data-direction="left" aria-label="Left">←</button><button type="button" data-direction="down" aria-label="Down">↓</button><button type="button" data-direction="right" aria-label="Right">→</button></div>
      </div>
      <p class="help-text">Use <kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move · <kbd>Space</kbd> to pause</p>
    </section>
  </main>
  <script src="snake-google.js"></script>
</body>
</html>
