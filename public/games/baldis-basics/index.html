<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>Baldi's Basics · BtrccGames</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f4f1fa; background: radial-gradient(ellipse at 50% 0%, #1d2b22 0, #111116 52%, #0b0b0e 100%); }
    main { width: min(100%, 520px); padding: 40px; border: 1px solid #343b35; border-radius: 24px; background: #181a19; box-shadow: 0 24px 80px #0008; text-align: center; }
    .icon { width: 68px; height: 68px; margin: 0 auto 20px; display: grid; place-items: center; border: 1px solid #4d614f; border-radius: 20px; background: #26372a; color: #a8d68d; font-size: 32px; }
    .eyebrow { margin: 0 0 10px; color: #a8d68d; font-size: 12px; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 40px); letter-spacing: -.04em; }
    .copy { margin: 16px auto 28px; max-width: 390px; color: #bbb7c5; line-height: 1.65; }
    a { min-height: 46px; padding: 0 20px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #596b59; border-radius: 12px; color: #f4f1fa; text-decoration: none; font-weight: 700; background: #29352b; }
    a:hover { filter: brightness(1.15); }
    .note { margin: 22px 0 0; color: #85818e; font-size: 12px; }
    @media (max-width: 480px) { main { padding: 30px 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">⚠</div>
    <p class="eyebrow">TEMPORARILY UNAVAILABLE</p>
    <h1>Baldi's Basics is broken right now</h1>
    <p class="copy">This game isn't working at the moment. Check back later.</p>
    <a href="/">Back to BtrccGames</a>
    <p class="note">The game files are still here for when you're ready to fix it.</p>
  </main>
</body>
</html>
